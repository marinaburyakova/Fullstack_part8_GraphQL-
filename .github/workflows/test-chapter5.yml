name: E2E tests (library)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install library-backend dependencies
        working-directory: library-backend
        run: npm ci

      - name: Install library-frontend dependencies
        working-directory: library-frontend
        run: npm ci

      - name: Install E2E test dependencies
        working-directory: tests-chapter5
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests-chapter5
        run: npx playwright install chromium --with-deps

      # 1. Запускаем GraphQL-бэкенд в фоновом режиме на порту 4000
      - name: Start library-backend in background
        working-directory: library-backend
        run: node index.js &
        env:
          NODE_ENV: test
          PORT: 4000
          JWT_SECRET: test-secret-key
          MONGODB_URI: mongodb://127.0.0.1:27017/graphqlLibraryTest

      # 2. Запускаем React-фронтенд в фоновом режиме на порту 5173
      - name: Start library-frontend in background
        working-directory: library-frontend
        run: npm run dev &

      # 3. Даем серверам 5 секунд на инициализацию портов и бьем нашими рабочими 16 тестами Playwright
      - name: Run E2E tests
        run: |
          sleep 5
          cd tests-chapter5
          npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests-chapter5/playwright-report/
          retention-days: 7
