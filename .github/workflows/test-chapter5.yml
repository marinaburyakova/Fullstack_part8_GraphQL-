name: E2E tests (library)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Поднимаем реальную базу данных MongoDB внутри контейнера GitHub
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install library-backend dependencies
        working-directory: library-backend
        run: npm ci

      - name: Install library-frontend dependencies
        working-directory: library-frontend
        run: npm ci

      - name: Install E2E test dependencies
        working-directory: tests-chapter5
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests-chapter5
        run: npx playwright install chromium --with-deps

      # Запускаем бэкенд в фоне и глушим логи, чтобы GitHub Actions не зависал
      - name: Start library-backend in background
        working-directory: library-backend
        run: node index.js > /dev/null 2>&1 &
        env:
          NODE_ENV: test
          PORT: 4000
          JWT_SECRET: test-secret-key
          MONGODB_URI: mongodb://localhost:27017/graphqlLibraryTest

      # ИСПРАВЛЕНО: Вернули законный "- name:" и убрали Berkut, выравнивание идеальное
      - name: Start library-frontend in background
        working-directory: library-frontend
        run: npm run dev > /dev/null 2>&1 &

      # Ждем 5 секунд готовности портов и запускаем наши рабочие 16 тестов Playwright
      - name: Run E2E tests
        run: |
          sleep 5
          cd tests-chapter5
          npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests-chapter5/playwright-report/
          retention-days: 7
